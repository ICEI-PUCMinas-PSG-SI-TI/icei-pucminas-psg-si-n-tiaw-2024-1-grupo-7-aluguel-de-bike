  <title>Cadastro de Instituições - Página 2</title>
  <style>
    .input_group {
      margin-bottom: 15px;
    }

    .input_box {
      margin-bottom: 10px;
    }

    @media (max-width: 576px) {
      .input_group {
        padding: 10px;
      }

      .input_box label,
      .input_box input {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <div
  class="d-flex justify-content-end flex-column-reverse flex-md-row align-items-center p-3 px-md-4 mb-3 bg-white border-bottom shadow-sm">
  <img class="d-block mx-auto mb-4" src="../assets/images/logo.png" alt="" width="100" height="100">
  <h2 class="my-0 mr-md-auto font-weight-normal" href="index.html">Easy Mov</h2>
  <nav class="my-2 my-md-0 mr-md-3">
    <a class="p-2 text" href="../index.html">Inicio</a>
    <a class="p-2 text" href="../pages/bikes_alugadas.html">Suas bikes</a>
    <a class="p-2 text" href="../pages/carrinho.html">Carrinho</a>
    <div class="btn-group">
      <button type="button" style="background-color: #524570; border-color:white;"
        class="btn btn-primary dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false"><span id="nomeUsuario"></button>
      <ul class="dropdown-menu">
        <a class="dropdown-item" href="#">Conta</a>
        <a class="dropdown-item" href="#">Logout</a>
      </ul>
    </div>
  </nav>
</div>
<script>
  document.getElementById('nomeUsuario').textContent = localStorage.getItem('usuario_logado');
</script>

  <button class="btn_return"><a href="../pages/cad_Instituicoes.html"><img src="##"
        alt=""></a>Voltar</button>
  <div class="container">
    <div class="card_cadas">
      <form id="cadastroInstituicaoForm2" class="form">
        <div class="input_group">
          <h2>Informe os dados da instituição</h2>
          <div class="input_box">
            <label for="espacoReser">A instituição possui espaço reservado para as bicicletas?</label><br>
            <input type="text" id="espacoReser" name="espacoReser" required><br>
          </div>
          <div class="input_box">
            <label for="veicPropio_Alu">Qual a média de alunos com veículo próprio?</label><br>
            <input type="text" id="veicPropio_Alu" name="veicPropio_Alu" required><br>
          </div>
          <div class="input_box">
            <label for="quantBike">Quantidade mínima de bicicletas que desejam?</label><br>
            <input type="text" id="quantBike" name="quantBike"><br>
          </div>
          <div class="input_box">
            <label for="tempoServico">Tempo pelo qual desejam utilizar as bicicletas?</label><br>
            <input type="text" id="tempoServico" name="tempoServico" required><br>
          </div>
        </div>
        <button type="button" class="btn_next" onclick="finalizarCadastro()">Finalizar</button>
      </form>
    </div>
  </div>
  <script src="../assets/js/cad_Instituicoes.js"> </script>
</body>

</html>
